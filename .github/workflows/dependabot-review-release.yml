name: Dependabot review and release

# Dependabot が出した更新 PR を Claude Code にレビューさせ、問題なければマージ、
# 問題があればクローズし、全部片付いたら README.md の手順でリリースする。
# モデルは下の CLAUDE_MODEL 一箇所で決まり、PR コメントとリリースコミットの記録にも
# そこから流れる。切り替えるときは CLAUDE_MODEL だけ書き換えればよい。
#
# Claude Code は anthropics/claude-code-action を通さず、CLI を直接動かしている。
# アクション経由の呼び出しだけが、残高があっても "Credit balance is too low" で
# 拒否されるため（anthropics/claude-code-action#1888。frontend-library-catalog では
# v1.0.248 で再現した）。同じ資格情報で CLI を直接動かす分には通る。直ったら
# アクションに戻してよい。そのときは review ジョブの「レビューする」に並べた注意点
# （読み取り専用トークン、OIDC の要求用変数を渡さない、--setting-sources user、
# 出力をログに流さない）をアクションの入力で満たすこと。
#
# 権限の配り方がこのワークフローの要点。レビューするモデルが読むのは PR 本文に
# 埋め込まれた上流のリリースノート、つまり攻撃者が書ける文章である。それを読んだ
# エージェント自身がマージまでできると、このワークフローが防ごうとしている攻撃が
# そのまま通る。だから review ジョブのトークンは読み取り専用にし、マージ・クローズ・
# タグ push は評決 JSON を受け取った apply ジョブの側で行う。

on:
  schedule:
    # 火曜 00:00 JST。GitHub の cron は UTC 固定なので月曜 15:00 UTC と書く。
    # Dependabot は月曜 09:00 JST に PR を作る（.github/dependabot.yml）ので、その 15 時間後。
    - cron: "0 15 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "レビューとビルド確認だけ行い、マージ・クローズ・リリースはしない"
        type: boolean
        default: true

# 既定は何も許可しない。必要な権限はジョブごとに与える。
permissions: {}

concurrency:
  group: dependabot-review-release
  cancel-in-progress: false

env:
  # Claude Code に --model で渡すモデル ID。レビュー手順は
  # .github/scripts/review-prompt.md 側に書き下してあるので、モデルを変えても変わらない。
  CLAUDE_MODEL: claude-opus-5-5
  # Claude Code CLI のバージョン。Dependabot は追わないので手で上げる。
  CLAUDE_CODE_VERSION: 2.1.296

jobs:
  collect:
    name: 対象の PR を集める
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      prs: ${{ steps.list.outputs.prs }}
      count: ${{ steps.list.outputs.count }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: 開いている Dependabot PR を列挙する
        id: list
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh pr list --repo "$GITHUB_REPOSITORY" --author "app/dependabot" \
            --state open --limit 50 \
            --json number,title,url,headRefName > prs.json

          count=$(jq length prs.json)
          {
            echo "count=$count"
            echo "prs=$(jq -c '[.[].number]' prs.json)"
          } >> "$GITHUB_OUTPUT"

          # ここを `[ "$count" -eq 0 ] && echo ...` と書かないこと。run ブロックの
          # 最後のコマンドになるため、PR が 1 件以上あると偽 -> 終了ステータス 1 で
          # ステップが失敗する。
          {
            echo "## 対象の PR: ${count} 件"
            echo
            jq -r '.[] | "- [#\(.number)](\(.url)) \(.title)"' prs.json
            if [ "$count" -eq 0 ]; then
              echo "更新 PR はありません。バージョンも上げません。"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: prs
          path: prs.json

  review:
    # ジョブ名には env コンテキストを書けないので、モデル名はステップのログに出す
    name: "#${{ matrix.pr }} をレビュー"
    needs: collect
    if: needs.collect.outputs.count != '0'
    runs-on: ubuntu-latest
    # 読み取り専用。モデルがマージ・コメント・push を試みても失敗する。
    permissions:
      contents: read
      pull-requests: read
      # Claude API に ID フェデレーションで入るための GitHub OIDC トークンを取るのに使う。
      # リポジトリへの書き込みは増えない。「レビューする」はトークンの要求用変数を
      # Claude Code のプロセスから外しているので、Claude が新たにトークンを取ることはできない。
      #
      # ただし、同じジョブのほかのステップには要求用変数が残る。このリポジトリの OIDC
      # トークンを信頼する先（Maven Central への OIDC での公開、クラウドへの OIDC 認証
      # など）を足すときは、そのジョブを environment に入れ、信頼する側でも environment
      # を条件にすること。そうしないと、このジョブからもそこへ入れてしまう。
      id-token: write
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        pr: ${{ fromJSON(needs.collect.outputs.prs) }}
    steps:
      - uses: actions/checkout@v5
        with:
          # チェックアウトが git config に残す資格情報も渡さない
          persist-credentials: false

      - name: プロンプトを用意する
        env:
          PR_NUMBER: ${{ matrix.pr }}
        run: |
          set -euo pipefail
          echo "model: ${CLAUDE_MODEL} / Claude Code ${CLAUDE_CODE_VERSION}"

          # チェックアウトの外に置く。作業ツリーにはリポジトリの中身だけを置いておく。
          mkdir -p "$RUNNER_TEMP/review"
          python3 - > "$RUNNER_TEMP/review/prompt.txt" <<'PY'
          import os, pathlib
          t = pathlib.Path(".github/scripts/review-prompt.md").read_text(encoding="utf-8")
          print(t.replace("{{PR_NUMBER}}", os.environ["PR_NUMBER"])
                 .replace("{{REPO}}", os.environ["GITHUB_REPOSITORY"]))
          PY

      - name: Claude Code を入れる
        run: |
          set -euo pipefail
          # アクションと同じ入れ方。バージョンは固定し、実行中の自動更新も止める
          # （次のステップの DISABLE_AUTOUPDATER）。
          for attempt in 1 2 3; do
            timeout --foreground --kill-after=10 120 \
              bash -c 'set -o pipefail; curl -fsSL https://claude.ai/install.sh | bash -s -- "$CLAUDE_CODE_VERSION"' \
              && break
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Claude Code ${CLAUDE_CODE_VERSION} を入れられなかった。"
              exit 1
            fi
            sleep 5
          done
          installed=$("$HOME/.local/bin/claude" --version | awk '{print $1}')
          if [ "$installed" != "$CLAUDE_CODE_VERSION" ]; then
            echo "::error::入ったのは Claude Code ${installed} で、指定の ${CLAUDE_CODE_VERSION} ではない。"
            exit 1
          fi
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # GitHub へは、このジョブの読み取り専用トークン（GH_TOKEN）だけを渡す。上の
      # permissions がそのまま効き、モデルがマージ・コメント・push を試みても失敗する。
      #
      # Claude API へは ID フェデレーションで入る。GitHub の OIDC トークンを短命の
      # アクセストークンに交換するので、長期の API キーを Secrets に置かずに済む。
      # 値は識別子で秘密ではないが、公開リポジトリのファイルやログに組織 ID を
      # 残さないよう Secrets に置いている（README.md 参照）。ANTHROPIC_API_KEY は
      # 渡さないこと。静的なキーがあるとそちらが優先され、フェデレーションは黙って
      # 使われなくなる。
      #
      # OIDC トークンの要求用変数（ACTIONS_ID_TOKEN_REQUEST_*）は Claude Code に渡さない。
      # 渡すと、上流の文章に誘導されたモデルが、このジョブの名前で OIDC トークンを
      # 取れてしまう。トークンを取るのはこのシェルだけで、Claude Code はファイルを読む。
      #
      # Claude に許すのは、--allowedTools に並べた読み取り系のコマンドだけ。
      # PR 本文に埋め込まれた上流のリリースノートは第三者が書ける文章なので、それに
      # 誘導されて任意のコマンドを走らせられる状態にはしない。--permission-mode dontAsk
      # なので、並べていないものは確認を待たずに拒否される。拒否されて確かめられなかった
      # ことは、プロンプトの指示どおり unverified に入る。許すコマンドを変えたら
      # review-prompt.md の「使えるコマンド」も合わせて直すこと。
      #
      # --setting-sources user でリポジトリの .claude/ を読ませないのは、そこにある
      # dependabot-merge スキルが「マージしてタグを打つ」手順だから。レビュー担当が
      # 読むと、自分の担当範囲を取り違える。
      #
      # 上流のソースやリリースノートはランナーの標準出力に流さない。ランナーは標準出力を
      # workflow command として読むので、上流に `##[add-matcher]...` のような行が
      # 含まれていると、ランナーがそれを実行しようとして「調べただけ」でジョブが落ちる。
      # Claude Code の出力はファイルに書き、ログには結果の要約だけを出す。
      - name: レビューする
        id: review
        # Claude が落ちたときや評決を返さなかったときこそ、次のステップの ERROR
        # フォールバックまで進めたいので、ここでは止めない。
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ANTHROPIC_FEDERATION_RULE_ID: ${{ secrets.ANTHROPIC_FEDERATION_RULE_ID }}
          ANTHROPIC_ORGANIZATION_ID: ${{ secrets.ANTHROPIC_ORGANIZATION_ID }}
          ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ secrets.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
          DISABLE_AUTOUPDATER: "1"
        run: |
          set -euo pipefail
          umask 077
          work="$RUNNER_TEMP/review"
          wif="$RUNNER_TEMP/claude-wif"
          mkdir -p "$wif/config/configs"

          # 空の変数も「指定あり」として扱われるので、secret が空なら消しておく。
          # ルールのワークスペースが 1 つなら、送らなくてもサーバーが選ぶ。
          [ -n "${ANTHROPIC_WORKSPACE_ID:-}" ] || unset ANTHROPIC_WORKSPACE_ID

          export ANTHROPIC_IDENTITY_TOKEN_FILE="$wif/identity-token"
          fetch_identity_token() {
            local token
            token=$(curl -fsS --retry 3 \
              -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://api.anthropic.com" \
              | jq -er .value) || return 1
            echo "::add-mask::${token}"
            # 書きかけのファイルを Claude Code に掴ませないよう、書いてから差し替える
            printf '%s' "$token" > "$ANTHROPIC_IDENTITY_TOKEN_FILE.tmp"
            mv "$ANTHROPIC_IDENTITY_TOKEN_FILE.tmp" "$ANTHROPIC_IDENTITY_TOKEN_FILE"
          }
          fetch_identity_token

          # フェデレーションをプロファイル経由にすると、交換したアクセストークンが
          # ディスクにキャッシュされ、Claude Code の子プロセスとも共有される。GitHub の
          # OIDC トークンは 1 回しか交換できない（jti）ので、プロセスごとに交換し直すと
          # 2 回目が jti_reused で拒否される。中身はこれだけでよく、残りの項目は
          # 上の ANTHROPIC_* から補われる。
          export ANTHROPIC_CONFIG_DIR="$wif/config" ANTHROPIC_PROFILE=default
          echo '{"version":"1.0","authentication":{"type":"oidc_federation"}}' \
            > "$ANTHROPIC_CONFIG_DIR/configs/default.json"

          # GitHub の OIDC トークンは 5 分で切れ、交換で得るアクセストークンの寿命も
          # その残り時間の 2 倍までに縛られる。Claude Code は更新のたびにファイルを
          # 読み直すので、長いレビューの間もファイルを新しく保つ。アクションは 4 分
          # おきだが、それだと残り 1 分のトークンを交換して寿命 2 分のアクセストークンに
          # なることがあるので、1 分おきにする。
          ( while sleep 60 </dev/null >/dev/null 2>&1; do
              fetch_identity_token || echo "::warning::GitHub の OIDC トークンを更新できなかった。"
            done ) &
          refresher=$!
          # キャッシュされたアクセストークンも $wif の下にあるので、まとめて消す
          trap 'kill "$refresher" 2>/dev/null || true; rm -rf "$wif"' EXIT

          # --allowedTools は値を複数取るので最後に置く。後ろに引数があると飲み込まれる。
          # 一覧はカンマ区切りで 1 つの引数にまとめる。
          status=0
          env -u ACTIONS_ID_TOKEN_REQUEST_URL -u ACTIONS_ID_TOKEN_REQUEST_TOKEN \
            claude -p \
              --model "$CLAUDE_MODEL" \
              --json-schema "$(jq -c . .github/scripts/verdict-schema.json)" \
              --setting-sources user \
              --permission-mode dontAsk \
              --no-session-persistence \
              --output-format stream-json --verbose \
              --allowedTools "Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh api:*),Bash(gh release view:*),Bash(curl -sS https://repo1.maven.org/maven2/:*),Bash(grep:*),Bash(jq:*),Bash(head:*),Bash(sort:*),Read,Grep,Glob" \
              < "$work/prompt.txt" > "$work/output.jsonl" || status=$?

          jq -c 'select(.type == "result")
                 | {subtype, is_error, duration_ms, num_turns, total_cost_usd}' \
            "$work/output.jsonl" || true
          exit "$status"

      - name: 評決を書き出す
        if: ${{ !cancelled() }}
        env:
          PR_NUMBER: ${{ matrix.pr }}
          REVIEW_OUTCOME: ${{ steps.review.outcome }}
        run: |
          set -euo pipefail
          echo "review: ${REVIEW_OUTCOME}"
          mkdir -p verdicts

          # 評決はモデルが書いた文字列で、上流の文章を引いていることがある。ログに出す
          # 区間だけ workflow command の解釈を止める。トークンは実行のたびに変える。
          # 固定値だと、上流のファイルに ::トークン:: を仕込んでおいて解釈を再開させられる。
          STOP=$(python3 -c 'import uuid; print(uuid.uuid4())')
          echo "::stop-commands::${STOP}"

          # 評決が取れなかったときは ERROR にする。ERROR は「調べていない」であって
          # 「問題なし」ではないので、apply ジョブはその PR に触れない。評決として使うのは
          # Claude Code が JSON Schema に沿って返した構造化出力だけで、本文は読まない。
          python3 - "$PR_NUMBER" "verdicts/${PR_NUMBER}.json" "$RUNNER_TEMP/review/output.jsonl" <<'PY'
          import json, sys

          pr, dst, src = int(sys.argv[1]), sys.argv[2], sys.argv[3]

          # 出力は 1 行 1 メッセージの JSON（stream-json）。最後の result が実行の結果。
          messages = []
          try:
              with open(src, encoding="utf-8") as f:
                  for line in f:
                      try:
                          m = json.loads(line)
                      except ValueError:
                          continue
                      if isinstance(m, dict):
                          messages.append(m)
          except OSError:
              pass
          result = next((m for m in reversed(messages) if m.get("type") == "result"), {})

          # 失敗の理由は API エラーの種類・HTTP ステータス・CLI のエラー文だけを拾う。
          # 認証や課金で落ちた回に、Console を見る前から原因の見当がつく。
          def failure_detail():
              kinds = [str(m["error"]) for m in messages
                       if m.get("type") == "assistant" and m.get("error")]
              status = result.get("api_error_status")
              parts = kinds[-1:] + ([f"HTTP {status}"] if status else [])
              # API エラーのときの result は CLI が作るエラー文で、モデルの文章ではない
              if parts and result.get("is_error") and result.get("result"):
                  parts.append(str(result["result"]))
              parts += [str(e) for e in result.get("errors") or []]
              return " ".join(" / ".join(parts).split())[:300]

          data = None
          if result and not result.get("is_error"):
              data = result.get("structured_output")
          if not isinstance(data, dict) or data.get("verdict") not in ("MERGE", "HOLD"):
              detail = failure_detail()
              data = {
                  "verdict": "ERROR",
                  "reason": f"レビューが完了しなかった: {detail}" if detail
                            else "評決を JSON として取り出せなかった",
                  "updates": "",
                  "checked": "",
                  "notes": "",
                  "unverified": ["レビューが完了せず、脆弱性・上流差分ともに未確認"],
              }

          # 改行やタブが残っていると、PR コメントでも Markdown の表でも崩れる。
          # 中身の良し悪しはここでは判断せず、形だけ整える。
          def flatten(v):
              return " ".join(str(v).split()).strip(" 、,")

          for key in ("reason", "updates", "checked", "notes"):
              data[key] = flatten(data.get(key, ""))
          data["unverified"] = [flatten(u) for u in (data.get("unverified") or []) if flatten(u)]

          data["pr"] = pr  # モデルの申告ではなく、ジョブが知っている番号を使う
          with open(dst, "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
          print(json.dumps(data, ensure_ascii=False, indent=2))
          PY

          # ここから下は自分の出力なので、workflow command の解釈を戻す。
          # 下の ::error:: を効かせるために必要。
          echo "::${STOP}::"

          {
            echo "## #${PR_NUMBER}"
            echo
            echo '```json'
            cat "verdicts/${PR_NUMBER}.json"
            echo
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          # 評決が取れなかったことは緑で流さない。apply ジョブは always() で動くので、
          # ここで落としても他の PR の処理は止まらない。
          if [ "$(jq -r .verdict "verdicts/${PR_NUMBER}.json")" = "ERROR" ]; then
            echo "::error::#${PR_NUMBER} の評決を取得できなかった。この PR には触らない。"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verdict-${{ matrix.pr }}
          path: verdicts/

  apply:
    name: マージ・クローズしてリリースする
    needs: [collect, review]
    # review が 1 件失敗しても残りは片付ける。失敗した PR は評決が無いので触られない。
    if: always() && needs.collect.result == 'success' && needs.collect.outputs.count != '0'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          # next-version.py がタグの重複を見るので、履歴とタグを全部持ってくる
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: verdict-*
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          name: prs

      - name: 前提を確認する
        run: |
          set -euo pipefail
          # 作業ツリーが汚れている / main にいない、のどちらかなら片付けようとせず止まる。
          # マージとタグ push は取り消しが面倒なので、前提が崩れたまま進める価値はない。
          #
          # --untracked-files=no を付けているのは、直前の download-artifact が prs.json と
          # artifacts/ を untracked で置くため。見たいのは追跡済みファイルが書き換わって
          # いないかどうかで、成果物の有無ではない。
          if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
            echo "::error::作業ツリーが汚れている。マージとタグ push は行わない。"
            git status --short
            exit 1
          fi
          branch=$(git rev-parse --abbrev-ref HEAD)
          if [ "$branch" != main ]; then
            echo "::error::main にいない (${branch})。マージとタグ push は行わない。"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: 評決に従って PR を片付ける
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: bash .github/scripts/settle-prs.sh

      - name: バージョンを上げてタグを打つ
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          merged=$(jq -s '[.[] | select(.outcome == "merged")] | length' results.jsonl)
          if [ "$merged" -eq 0 ]; then
            echo "マージできた PR が無いので、上げるものが無い。バージョンは据え置く。" \
              | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          git pull --ff-only origin main

          # パッチ +1、タグ名、-SNAPSHOT の混入チェック、タグの重複チェックは
          # このスクリプトが行う。手で計算しないこと。
          python3 .claude/skills/dependabot-merge/scripts/next-version.py --apply | tee version.txt
          version=$(sed -n 's/^next=//p' version.txt)
          tag=$(sed -n 's/^tag=//p' version.txt)

          # BOM は POM が全てなので、生成物を見るのが唯一の検証
          ./gradlew --no-daemon build publishToMavenLocal

          python3 .github/scripts/build-release-notes.py \
            --results results.jsonl --version "$version" --model "$CLAUDE_MODEL" \
            --out release-notes.txt

          git add gradle.properties
          git commit -F release-notes.txt
          git tag "$tag"
          git push origin main
          git push origin "$tag"

          {
            echo "## リリース: ${tag}"
            echo
            echo "タグを push したので JitPack がビルドする。"
            echo
            echo '```'
            cat release-notes.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: run-record
          path: |
            results.jsonl
            release-notes.txt
          if-no-files-found: warn
