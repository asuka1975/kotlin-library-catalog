name: Dependabot review and release

# Dependabot が出した更新 PR を Sakana Fugu にレビューさせ、問題なければマージ、
# 問題があればクローズし、全部片付いたら README.md の手順でリリースする。
# モデルは下の FUGU_MODEL 一箇所で決まり、PR コメントとリリースコミットの記録にも
# そこから流れる。切り替えるときは FUGU_MODEL だけ書き換えればよい。
#
# 権限の配り方がこのワークフローの要点。レビューするモデルが読むのは PR 本文に
# 埋め込まれた上流のリリースノート、つまり攻撃者が書ける文章である。それを読んだ
# エージェント自身がマージまでできると、このワークフローが防ごうとしている攻撃が
# そのまま通る。だから review ジョブのトークンは読み取り専用にし、マージ・クローズ・
# タグ push は評決 JSON を受け取った apply ジョブの側で行う。

on:
  schedule:
    # 火曜 00:00 JST。GitHub の cron は UTC 固定なので月曜 15:00 UTC と書く。
    # Dependabot は月曜 09:00 JST に PR を作る（.github/dependabot.yml）ので、その 15 時間後。
    - cron: "0 15 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "レビューとビルド確認だけ行い、マージ・クローズ・リリースはしない"
        type: boolean
        default: true

# 既定は何も許可しない。必要な権限はジョブごとに与える。
permissions: {}

concurrency:
  group: dependabot-review-release
  cancel-in-progress: false

env:
  # fugu-cyber は従量課金なので使わない。セキュリティ特化ではないぶん、
  # レビュー手順は .github/scripts/review-prompt.md 側で明示的に指示している。
  FUGU_MODEL: fugu-ultra-v1.1

jobs:
  collect:
    name: 対象の PR を集める
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      prs: ${{ steps.list.outputs.prs }}
      count: ${{ steps.list.outputs.count }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: 開いている Dependabot PR を列挙する
        id: list
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh pr list --repo "$GITHUB_REPOSITORY" --author "app/dependabot" \
            --state open --limit 50 \
            --json number,title,url,headRefName > prs.json

          count=$(jq length prs.json)
          {
            echo "count=$count"
            echo "prs=$(jq -c '[.[].number]' prs.json)"
          } >> "$GITHUB_OUTPUT"

          # ここを `[ "$count" -eq 0 ] && echo ...` と書かないこと。run ブロックの
          # 最後のコマンドになるため、PR が 1 件以上あると偽 -> 終了ステータス 1 で
          # ステップが失敗する。
          {
            echo "## 対象の PR: ${count} 件"
            echo
            jq -r '.[] | "- [#\(.number)](\(.url)) \(.title)"' prs.json
            if [ "$count" -eq 0 ]; then
              echo "更新 PR はありません。バージョンも上げません。"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: prs
          path: prs.json

  review:
    # ジョブ名には env コンテキストを書けないので、モデル名はステップのログに出す
    name: "#${{ matrix.pr }} をレビュー"
    needs: collect
    if: needs.collect.outputs.count != '0'
    runs-on: ubuntu-latest
    # 読み取り専用。モデルがマージ・コメント・push を試みても失敗する。
    permissions:
      contents: read
      pull-requests: read
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        pr: ${{ fromJSON(needs.collect.outputs.prs) }}
    steps:
      - uses: actions/checkout@v5
        with:
          # チェックアウトが git config に残す資格情報も渡さない
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: codex-fugu を入れる
        env:
          SAKANA_API_KEY: ${{ secrets.SAKANA_API_KEY }}
        run: |
          set -euo pipefail

          # Fugu の設定バンドルは Codex のバージョンと完全一致でしか配置されない。
          # 一致しないとインストーラは --yes の下で Codex を差し替えず、設定も
          # codex-fugu ランチャも置かないまま、警告だけ出して終了コード 0 で抜ける。
          # 最新の Codex を入れていた頃は、Fugu の固定先より新しい Codex が npm に
          # 出た時点から、次の codex-fugu が command not found で落ちていた。
          #
          # 固定先を決めているのは Fugu 側なので、先に clone して configs/bundle.sh
          # から読み、ちょうどそのバージョンを入れる。Fugu が固定先を上げれば、
          # こちらは何もしなくても追従する。bundle.sh は source しない。取得した
          # コードをここで実行することになるので、値を読むだけにする。
          git clone --quiet https://github.com/SakanaAI/fugu.git "$HOME/.fugu"
          echo "fugu: $(git -C "$HOME/.fugu" log -1 --format='%h %s')"
          codex_version=$(sed -n 's/^BUNDLE_CODEX_VERSION="\([0-9][0-9.]*\)"$/\1/p' \
            "$HOME/.fugu/configs/bundle.sh")
          if ! [[ "$codex_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Fugu の configs/bundle.sh から BUNDLE_CODEX_VERSION を読めなかった（[${codex_version}]）。"
            exit 1
          fi
          npm install -g "@openai/codex@${codex_version}"

          # curl | bash のブートストラップは clone して scripts/install.sh を呼ぶだけ
          # なので、clone 済みのものを直接呼ぶ。固定先を読んだのと同じツリーの
          # インストーラが動き、配布サーバ上のブートストラップの中身にも左右されない。
          bash "$HOME/.fugu/scripts/install.sh" --yes

          # インストーラは設定を配置できなくても 0 で抜ける。成否はここで見る。
          if ! command -v codex-fugu >/dev/null; then
            echo "::error::codex-fugu ランチャが置かれていない。入った Codex（$(codex --version 2>/dev/null || echo 不明)）と Fugu の固定先 ${codex_version} の一致を上のログで確認すること。"
            exit 1
          fi
          codex-fugu --status

      - name: レビューする
        env:
          GH_TOKEN: ${{ github.token }}
          SAKANA_API_KEY: ${{ secrets.SAKANA_API_KEY }}
          PR_NUMBER: ${{ matrix.pr }}
          CODEX_FUGU_NO_UPDATE: "1"
        run: |
          set -uo pipefail
          # Actions の既定シェルは `bash -e {0}` なので、明示的に切らないと errexit が
          # 残る。codex が落ちたときこそ後段の ERROR フォールバックまで進めたいので、
          # ここだけは切る。ステップの成否は最後の if で自分で決める。
          set +e
          echo "model: ${FUGU_MODEL}"
          mkdir -p verdicts

          python3 - > prompt.txt <<'PY'
          import os, pathlib
          t = pathlib.Path(".github/scripts/review-prompt.md").read_text(encoding="utf-8")
          print(t.replace("{{PR_NUMBER}}", os.environ["PR_NUMBER"])
                 .replace("{{REPO}}", os.environ["GITHUB_REPOSITORY"]))
          PY

          # ここから先は、上流のソースやリリースノートをそのままログに流す。ランナーは
          # 標準出力を workflow command として読むので、止めずに流すと、上流に含まれる
          # `##[add-matcher]...` のような行をランナーが実行しようとして失敗し、
          # 「調べただけ」でジョブが落ちる。読むものは資料であって指示ではない、という
          # 話がモデルだけでなくランナーにも要る。
          #
          # トークンは実行のたびに変える。固定値だと、上流のファイルに ::トークン:: を
          # 仕込んでおいて解釈を再開させられる。
          STOP=$(python3 -c 'import uuid; print(uuid.uuid4())')
          echo "::stop-commands::${STOP}"

          # サンドボックスを開けているのは、上流の advisory / リリース / タグ間差分を
          # 引くのにネットワークと gh が要るため。ランナーは使い捨てで、このジョブの
          # トークンは読み取り専用なので、開けても書き換えられるものが無い。
          codex-fugu exec \
            --model "$FUGU_MODEL" \
            --sandbox danger-full-access \
            --output-schema .github/scripts/verdict-schema.json \
            --output-last-message raw-verdict.txt \
            - < prompt.txt

          # 評決が取れなかったときは ERROR にする。ERROR は「調べていない」であって
          # 「問題なし」ではないので、apply ジョブはその PR に触れない。
          python3 - "$PR_NUMBER" raw-verdict.txt "verdicts/${PR_NUMBER}.json" <<'PY'
          import json, re, sys

          pr, src, dst = int(sys.argv[1]), sys.argv[2], sys.argv[3]
          try:
              text = open(src, encoding="utf-8").read()
          except OSError:
              text = ""

          data = None
          for candidate in (text.strip(), *(m.group(0) for m in re.finditer(r"\{.*\}", text, re.S))):
              try:
                  data = json.loads(candidate)
                  break
              except (json.JSONDecodeError, ValueError):
                  continue

          if not isinstance(data, dict) or data.get("verdict") not in ("MERGE", "HOLD"):
              data = {
                  "verdict": "ERROR",
                  "reason": "評決を JSON として取り出せなかった",
                  "updates": "",
                  "checked": "",
                  "notes": "",
                  "unverified": ["レビューが完了せず、脆弱性・上流差分ともに未確認"],
              }

          # 改行やタブが残っていると、PR コメントでも Markdown の表でも崩れる。
          # 中身の良し悪しはここでは判断せず、形だけ整える。
          def flatten(v):
              return " ".join(str(v).split()).strip(" 、,")

          for key in ("reason", "updates", "checked", "notes"):
              data[key] = flatten(data.get(key, ""))
          data["unverified"] = [flatten(u) for u in (data.get("unverified") or []) if flatten(u)]

          data["pr"] = pr  # モデルの申告ではなく、ジョブが知っている番号を使う
          with open(dst, "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
          print(json.dumps(data, ensure_ascii=False, indent=2))
          PY

          # ここから下は自分の出力なので、workflow command の解釈を戻す。
          # 下の ::error:: を効かせるために必要。
          echo "::${STOP}::"

          {
            echo "## #${PR_NUMBER}"
            echo
            echo '```json'
            cat "verdicts/${PR_NUMBER}.json"
            echo
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          # 評決が取れなかったことは緑で流さない。apply ジョブは always() で動くので、
          # ここで落としても他の PR の処理は止まらない。
          if [ "$(jq -r .verdict "verdicts/${PR_NUMBER}.json")" = "ERROR" ]; then
            echo "::error::#${PR_NUMBER} の評決を取得できなかった。この PR には触らない。"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verdict-${{ matrix.pr }}
          path: verdicts/

  apply:
    name: マージ・クローズしてリリースする
    needs: [collect, review]
    # review が 1 件失敗しても残りは片付ける。失敗した PR は評決が無いので触られない。
    if: always() && needs.collect.result == 'success' && needs.collect.outputs.count != '0'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          # next-version.py がタグの重複を見るので、履歴とタグを全部持ってくる
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: verdict-*
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          name: prs

      - name: 前提を確認する
        run: |
          set -euo pipefail
          # 作業ツリーが汚れている / main にいない、のどちらかなら片付けようとせず止まる。
          # マージとタグ push は取り消しが面倒なので、前提が崩れたまま進める価値はない。
          #
          # --untracked-files=no を付けているのは、直前の download-artifact が prs.json と
          # artifacts/ を untracked で置くため。見たいのは追跡済みファイルが書き換わって
          # いないかどうかで、成果物の有無ではない。
          if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
            echo "::error::作業ツリーが汚れている。マージとタグ push は行わない。"
            git status --short
            exit 1
          fi
          branch=$(git rev-parse --abbrev-ref HEAD)
          if [ "$branch" != main ]; then
            echo "::error::main にいない (${branch})。マージとタグ push は行わない。"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: 評決に従って PR を片付ける
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: bash .github/scripts/settle-prs.sh

      - name: バージョンを上げてタグを打つ
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          merged=$(jq -s '[.[] | select(.outcome == "merged")] | length' results.jsonl)
          if [ "$merged" -eq 0 ]; then
            echo "マージできた PR が無いので、上げるものが無い。バージョンは据え置く。" \
              | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          git pull --ff-only origin main

          # パッチ +1、タグ名、-SNAPSHOT の混入チェック、タグの重複チェックは
          # このスクリプトが行う。手で計算しないこと。
          python3 .claude/skills/dependabot-merge/scripts/next-version.py --apply | tee version.txt
          version=$(sed -n 's/^next=//p' version.txt)
          tag=$(sed -n 's/^tag=//p' version.txt)

          # BOM は POM が全てなので、生成物を見るのが唯一の検証
          ./gradlew --no-daemon build publishToMavenLocal

          python3 .github/scripts/build-release-notes.py \
            --results results.jsonl --version "$version" --model "$FUGU_MODEL" \
            --out release-notes.txt

          git add gradle.properties
          git commit -F release-notes.txt
          git tag "$tag"
          git push origin main
          git push origin "$tag"

          {
            echo "## リリース: ${tag}"
            echo
            echo "タグを push したので JitPack がビルドする。"
            echo
            echo '```'
            cat release-notes.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: run-record
          path: |
            results.jsonl
            release-notes.txt
          if-no-files-found: warn
